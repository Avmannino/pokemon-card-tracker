name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 minutes without a
# visit, and waking it takes 30-60 seconds. A ping every 5 minutes keeps it
# up, with room for GitHub delaying a scheduled run. Render's free 750
# hours a month cover one service running all month.

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}

    steps:
      - name: Ping backend
        # Never fails the run (no failure emails); the next ping retries.
        run: |
          curl -sS --max-time 90 "$BACKEND_URL/health" || echo "Backend didn't answer this time."
